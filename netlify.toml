[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Il listino deve essere sempre fresco: quando il titolare cambia un prezzo,
# il cliente deve vedere subito il nuovo valore.
[[headers]]
  for = "/listino.json"
  [headers.values]
    Cache-Control = "no-cache"

# Seconda pagina: l'area del titolare. È la stessa app React, che mostra l'admin
# quando l'indirizzo finisce con /admin.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
